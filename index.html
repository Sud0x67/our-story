<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4e7d8" />
    <meta name="description" content="坡坡与小禾的故事，从初识，到一起走向往后的日子。" />
    <title>坡坡与小禾 · 我们的故事</title>
    <!-- story-theme-bootstrap -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/film.css" />
  </head>
  <body>
    <main
      id="film"
      tabindex="0"
      aria-label="坡坡与小禾的全屏三维故事"
      aria-describedby="keyboard-help"
    >
      <div id="world" aria-label="点击或滑动，走进我们的故事"></div>
      <div id="vignette" aria-hidden="true"></div>
      <div id="transition" aria-hidden="true"></div>
      <p id="caption" class="film-caption" aria-live="polite"></p>
      <p id="proposal" aria-hidden="true"></p>
      <p
        id="proposal-announcement"
        class="sr-only"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></p>
      <div id="loading" aria-label="正在准备故事"><span></span></div>
      <p id="world-error" hidden>这个浏览器暂时无法显示 3D 场景，请使用支持 WebGL 的浏览器。</p>
      <p id="keyboard-help" class="sr-only">
        每幕只需点击一次暖色圆形提示或画面任意位置，动作完成后停留三秒并自动转场，下一幕会再次等待。提前点击会先完整展示开场，再开始动作；无需重复点击。左滑或上滑直接进入下一幕，右滑或下滑返回上一幕。每次切换都从该幕开头重新播放。圆形提示只在等待点击或手动暂停时出现。滚轮和方向键也可切换。右键或双指拖动观察场景。空格暂停，暂停时点击或按
        Enter 只恢复播放。T 字幕，M 音乐，F 全屏，R 重播，End 前往戒指盒。最后需明确点击打开戒指盒。
      </p>
    </main>
    <noscript>请启用 JavaScript 来观看我们的故事。</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
